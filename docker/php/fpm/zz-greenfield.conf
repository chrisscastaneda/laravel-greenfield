[global]
error_log = /proc/self/fd/2

[www]
listen = 9000
access.log = /dev/null

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Used by the container health check.
ping.path = /ping
ping.response = pong

catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
